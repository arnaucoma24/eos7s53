Identifier: eos7s53
Slug: mtbaim
Status: In progress
Title: MtbAIM Antitubercular Activity
Description: 'Predicts small-molecule activity against Mycobacterium tuberculosis
  H37Rv, modelling drug-susceptible and drug-resistant isolates separately: an active/inactive
  probability for each, plus pMIC estimates for MIC, MIC90 and MIC99 endpoints. Eight
  tree-based models use RDKit descriptors and Morgan fingerprints trained on ChEMBL,
  reaching scaffold-held-out AUROC of 0.86 (susceptible) and 0.84 (resistant). Validation
  is retrospective only, and the resistant MIC99 set holds just 180 compounds.'
